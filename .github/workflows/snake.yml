name: Generate Snake

on:
  schedule:
    - cron: "0 2 * * *" # каждый день в 05:00 МСК
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake/github-contribution-grid-snake.svg?color_snake=#c1121f&color_dots=#ebedf0,#ffd5da,#ff9aa4,#ff5c6b,#e63946
            assets/github-snake/github-contribution-grid-snake-dark.svg?color_snake=#ff4757&color_dots=#0d1117,#151b23,#1f2630,#2d333b,#ff4757

      - name: Commit snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake animation [skip ci]"
